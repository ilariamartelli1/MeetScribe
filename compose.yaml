services:
  app:
    build: .
    environment:
      MEETSCRIBE_DEVICE: cuda
    gpus: all
    ports:
      - "127.0.0.1:${MEETSCRIBE_PORT:-8000}:8000"
    volumes:
      - ./models:/app/models:ro
    networks:
      - default
      - inference
  ollama:
    image: ollama/ollama:0.40.17@sha256:ccc42bcd3d5fcf7ab0d532b300382154e1a4da56fc666bdb313b78ebdd912754
    profiles:
      - summary
    gpus: all
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_KEEP_ALIVE: "0"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ./ollama:/root/.ollama
    networks:
      - inference
    healthcheck:
      test: ["CMD", "ollama", "ps"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  inference:
    internal: true
