[project]
name = "meetscribe"
version = "0.1.0"
description = "Local meeting transcription and minutes"
requires-python = ">=3.12,<3.13"
dependencies = [
    "av==18.1.0",
    "ctranslate2==4.8.5",
    "fastapi==0.115.12",
    "faster-whisper==1.2.1",
    "python-multipart==0.0.32",
    "uvicorn==0.34.3",
]

[dependency-groups]
cuda = [
    "nvidia-cublas-cu12==12.9.3.13",
    "nvidia-cudnn-cu12==9.28.1.4",
]
diarization = [
    "pyannote-audio==4.0.0",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchcodec==0.7.0",
]
dev = [
    "httpx==0.28.1",
    "jiwer==4.0.0",
    "mypy==1.15.0",
    "nemo-text-processing==1.2.0",
    "playwright==1.56.0",
    "pytest==8.3.5",
    "ruff==0.11.13",
    "wetextprocessing",
]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "test"]

[tool.ruff]
target-version = "py312"

[tool.uv.sources]
wetextprocessing = { git = "https://github.com/wenet-e2e/WeTextProcessing.git", rev = "94ab845bc83330a4819a799831462d6f7a7b93ab" }
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
