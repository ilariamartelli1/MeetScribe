[project]
name = "meetscribe"
version = "0.1.0"
description = "Local meeting transcription and minutes"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.3",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==1.15.0",
    "pytest==8.3.5",
    "ruff==0.11.13",
]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "test"]

[tool.ruff]
target-version = "py312"
