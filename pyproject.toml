[project]
name = "meetscribe"
version = "0.1.0"
description = "Local meeting transcription and minutes"
requires-python = ">=3.12,<3.13"
dependencies = [
    "av==18.1.0",
    "ctranslate2==4.8.5",
    "fastapi==0.115.12",
    "faster-whisper==1.2.1",
    "python-multipart==0.0.32",
    "uvicorn==0.34.3",
]

[dependency-groups]
cuda = [
    "nvidia-cublas-cu12==12.9.3.13",
    "nvidia-cudnn-cu12==9.28.1.4",
]
dev = [
    "httpx==0.28.1",
    "mypy==1.15.0",
    "pytest==8.3.5",
    "ruff==0.11.13",
]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "test"]

[tool.ruff]
target-version = "py312"
