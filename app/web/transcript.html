<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Optional transcript download — MeetScribe</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/transcript.js" defer></script>
</head>
<body>
  <main>
    <h1>Optional transcript download</h1>
    <p>The transcript is not displayed on this page. Download it only when needed; speaker labels are anonymous and may be incorrect.</p>
    <p id="status" role="status" aria-live="polite">Ready.</p>
    <p id="error" role="alert" hidden></p>
    <button id="download-transcript" type="button">Download transcript TXT</button>
    <p><a href="/">Return to MeetScribe</a></p>
  </main>
</body>
</html>
